name: Build & Upload iOS IPA to App Store Connect

on:
  workflow_dispatch:

jobs:
  build-and-upload-ios:
    name: Build & Upload to App Store Connect
    runs-on: macos-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Select Xcode Version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable' # Selects installed Xcode 26+

      - name: Extract iOS Version from pubspec.yaml
        id: extract_ios_version
        run: |
          # Read ios_version (e.g. 1.0.0+1)
          IOS_FULL_VER=$(grep '^ios_version:' pubspec.yaml | awk '{print $2}' | tr -d '"' | tr -d "'")
          
          # Separate into build_name (1.0.0) and build_number (1)
          BUILD_NAME=$(echo $IOS_FULL_VER | cut -d'+' -f1)
          BUILD_NUMBER=$(echo $IOS_FULL_VER | cut -d'+' -f2)
                
          echo "build_name=$BUILD_NAME" >> $GITHUB_OUTPUT
          echo "build_number=$BUILD_NUMBER" >> $GITHUB_OUTPUT
                
          echo "Extracted iOS Version Name: $BUILD_NAME"
          echo "Extracted iOS Build Number: $BUILD_NUMBER"

      - name: Install Apple Certificate and Provisioning Profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          echo "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          security import $CERTIFICATE_PATH -k $KEYCHAIN_PATH -P "$P12_PASSWORD" -A -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychains -s $KEYCHAIN_PATH $(security list-keychains | xargs)

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Install CocoaPods dependencies
        run: |
          flutter pub get
          cd ios && pod install && cd ..

      - name: Create ExportOptions.plist
        run: |
          cat <<EOF > ios/ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>uploadSymbols</key>
              <true/>
              <key>uploadBitcode</key>
              <false/>
          </dict>
          </plist>
          EOF

      - name: Build Signed IPA
        run: |
          flutter build ipa --release \
            --build-name="${{ steps.extract_ios_version.outputs.build_name }}" \
            --build-number="${{ steps.extract_ios_version.outputs.build_number }}" \
            --export-options-plist=ios/ExportOptions.plist

      - name: Upload Build to App Store Connect
        uuses: apple-actions/upload-testflight-build@v1
        with:
          app-path: build/ios/ipa/*.ipa
          issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          api-private-key: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}

      - name: Upload Signed IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SGT-iOSbundle-${{ steps.extract_ios_version.outputs.build_name }}+${{ steps.extract_ios_version.outputs.build_number }}-artifact
          path: |
            build/ios/ipa/*.ipa
            build/ios/archive/Runner.xcarchive