name: sahulat_ghar_tak
description: A professional home services marketplace mobile application.
# Author: Rayder-23
# Team: Coditum Solutions
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: '>=2.18.0 <3.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.0.5
  sqflite: ^2.0.2+1
  path: ^1.8.0
  path_provider: ^2.0.11
  flutter_animate: ^4.0.0
  intl: ^0.18.0
  http: ^1.1.0
  http_parser: ^4.1.2
  image_picker: ^1.1.2
  flutter_secure_storage: ^9.0.0
  fl_chart: ^0.66.0
  animations: ^2.0.11
  url_launcher: ^6.3.0
  dropdown_button2: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  change_app_package_name: ^1.5.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

dependency_overrides:
  path_provider_foundation: 2.5.1

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/icon/app_icon.png
    - assets/icon/app_logo_transparent.png

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  adaptive_icon_background: "#016EE3"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"

flutter_native_splash:
  color: "#016EE3"
  image: "assets/icon/app_icon_splash.png"
  android_12:
    image: "assets/icon/app_icon_splash.png"
    icon_background_color: "#016EE3"
  ios: true
